workspace = { members = ["examples/vector_store_surrealdb"] }
[package]
name = "langchain-rust"
version = "5.1.0"
edition = "2021"
publish = true
repository = "https://github.com/Abraxas-365/langchain-rust"
license = "MIT"
description = "LangChain for Rust, the easiest way to write LLM-based programs in Rust"
keywords = ["chain", "chatgpt", "llm", "langchain"]
documentation = "https://docs.rs/langchain-rust"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
scraper = "0.29"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.89"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "native-tls",
] }
serde_json = "1.0.145"
futures = "0.3.31"
regex = "1.11"
log = "0.4.28"
reqwest-eventsource = "0.6.0"
async-openai = { version = "0.42", default-features = false, features = [
    "native-tls",
    "chat-completion",
    "embedding",
    "audio",
] }
mockito = "1.7"
tiktoken-rs = "0.12"
sqlx = { version = "0.9", default-features = false, features = [
    "postgres",
    "sqlite",
    "runtime-tokio",
    "tls-native-tls",
    "json",
    "uuid",
], optional = true }
uuid = { version = "1.18", features = ["v4"], optional = true }
pgvector = { version = "0.4.2", features = [
    "postgres",
    "sqlx",
], optional = true }
text-splitter = { version = "0.33", features = ["tiktoken-rs", "markdown"] }
surrealdb = { version = "3", optional = true, default-features = false }
csv = "1.3"
urlencoding = "2.1.3"
lopdf = { version = "0.46", optional = true }
pdf-extract = { version = "0.12", optional = true }
thiserror = "2.0.17"
futures-util = "0.3.31"
async-stream = "0.3.6"
tokio-stream = "0.1.17"
secrecy = { version = "0.10.3", features = ["serde"] }
readability = "0.3.0"
htmd = { version = "0.5", optional = true }
url = "2.5.7"
fastembed = { version = "7", optional = true }
# Same ort as fastembed (it pins an exact rc); needed to share one ONNX Environment per process.
ort = { version = "2.0.0-rc.15", optional = true, default-features = false }
flume = { version = "0.12", optional = true }
gix = { version = "0.89", default-features = false, optional = true, features = [
    "parallel",
    "revision",
    "serde",
    "sha1",
] }
opensearch = { version = "2.3", optional = true, features = ["aws-auth"] }
aws-config = { version = "1.8", optional = true, features = [
    "behavior-version-latest",
] }
glob = "0.3.3"
strum_macros = "0.28"
async-recursion = "1.1.1"
tree-sitter = { version = "0.27", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
qdrant-client = { version = "1.19", optional = true }
ollama-rs = { version = "0.3.6", optional = true, features = ["stream"] }
mistralai-client = { version = "0.14.0", optional = true }


[features]
default = []
fastembed = ["dep:fastembed", "dep:ort"]
git = ["gix", "flume"]
html-to-markdown = ["dep:htmd"]
mistralai = ["mistralai-client"]
lopdf = ["dep:lopdf"]
pdf-extract = ["dep:pdf-extract"]
ollama = ["ollama-rs"]
opensearch = ["dep:opensearch", "aws-config"]
postgres = ["pgvector", "sqlx", "uuid"]
qdrant = ["qdrant-client", "uuid"]
sqlite-vss = ["sqlx"]
sqlite-vec = ["sqlx"]
surrealdb = ["dep:surrealdb"]
tree-sitter = [
    "cc",
    "dep:tree-sitter",
    "dep:tree-sitter-c",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-kotlin-ng",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-typescript",
]

[dev-dependencies]
base64 = "0.23"
surrealdb = { version = "3", default-features = false, features = ["kv-mem"] }
tokio-test = "0.4.6"
testcontainers = "0.28"

[build-dependencies]
cc = { version = "1.2", optional = true }
